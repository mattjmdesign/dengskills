name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository validation
        run: python3 scripts/validate-repo.py
      - name: Security scan
        run: python3 scripts/audit-security.py
      - name: Script syntax checks
        run: python3 -m py_compile scripts/*.py
